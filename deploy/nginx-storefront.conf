# nginx site for the storefront. The README's step 5 copies this file into place and swaps in your domain.
# Certbot then adds HTTPS to it. Keep PORT=3000 and BASE_PATH=/ in .env, or change the matching values below.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: with TRUST_PROXY=true the app's sign-in rate limits trust this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
# Behind Cloudflare or another CDN, restore the shopper's IP first (set_real_ip_from <CDN ranges>;
# real_ip_header CF-Connecting-IP;). Don't add a long cache header to sw.js: the app serves it uncached on purpose.
