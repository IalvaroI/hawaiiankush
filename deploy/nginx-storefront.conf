# Add this inside the nginx `server { ... }` block that serves your domain over HTTPS, then run:
#   nginx -t && systemctl reload nginx
# It assumes BASE_PATH=/ and PORT=3000 in .env. For a path such as /shop, use `location /shop/ { ... }` and add
# `location = /shop { return 301 /shop/$is_args$args; }`.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append: with TRUST_PROXY=true the app's sign-in rate limits trust this header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
# Behind Cloudflare or another CDN, restore the shopper's IP first (set_real_ip_from <CDN ranges>;
# real_ip_header CF-Connecting-IP;). Don't add a long cache header to sw.js: the app serves it uncached on purpose.
